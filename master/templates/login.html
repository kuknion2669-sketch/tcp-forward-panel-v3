<!DOCTYPE html>
<html><head><meta charset=utf-8><title>登录 — v3 联动管理</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070b14;color:#e2e8f0;font:14px/1.6 system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{background:#0d1225;border:1px solid #1e293b;border-radius:12px;padding:40px;width:360px}
.logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#8b5cf6,#6366f1);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;font-weight:700;margin:0 auto 16px}
h2{text-align:center;font-size:16px;font-weight:600}
.sub{text-align:center;font-size:12px;color:#64748b;margin-bottom:28px}
input{width:100%;padding:9px 14px;margin-bottom:16px;border-radius:6px;border:1px solid #1e293b;background:#111827;color:#e2e8f0;font-size:14px;outline:none}
input:focus{border-color:#8b5cf6}
button{width:100%;padding:10px;border-radius:6px;border:none;background:#8b5cf6;color:#fff;font-size:14px;font-weight:500;cursor:pointer}
button:hover{background:#7c3aed}
.error{color:#ef4444;font-size:12px;text-align:center;margin-top:12px}
</style>
</head><body>
<div class="card">
  <div class="logo">⛭</div>
  <h2>v3 联动管理</h2>
  <div class="sub">请登录以继续</div>
  <form method=post>
    <input name=username placeholder="账号" required>
    <input name=password type=password placeholder="密码" required>
    <button type=submit>登 录</button>
    {% if error %}<div class=error>{{ error }}</div>{% endif %}
  </form>
</div>
</body></html>
